<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GDG RACE - Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/play.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <div class="brand" id="brand"></div>
    <div id="conn" class="conn"><i></i><span>Connecting…</span></div>
  </header>

  <!-- Join: code, name, car -->
  <section id="view-join" class="view">
    <h1 class="neon">GDG RACE</h1>
    <p class="sub">CODE TO VICTORY</p>
    <label>Room code
      <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ABCD">
    </label>
    <label>Your name
      <input id="name" maxlength="16" autocomplete="nickname" placeholder="Your racing name">
    </label>
    <div class="lbl">Pick your car</div>
    <div id="cars" class="cars"></div>
    <button id="join" class="btn go big" disabled>Join race</button>
    <p id="join-msg" class="msg"></p>
  </section>

  <!-- Controller -->
  <section id="view-play" class="view hidden">
    <div class="info">
      <div id="car-art" class="car-art"></div>
      <div class="who"><div id="me-name" class="me-name"></div><div id="me-car" class="muted"></div></div>
      <div id="status" class="status">Waiting for host…</div>
      <div id="count" class="count hidden">10</div>
      <div id="stats" class="stats"></div>
      <div id="result" class="result hidden"></div>
    </div>
    <div id="pads" class="pads disabled">
      <button id="btn-left" class="pad left" type="button" aria-label="Steer left"><span class="arrow">◀</span><span class="t">LEFT</span></button>
      <button id="btn-right" class="pad right" type="button" aria-label="Steer right"><span class="arrow">▶</span><span class="t">RIGHT</span></button>
    </div>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/game.js"></script>
<script src="/play.js"></script>
</body>
</html>
