<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5EC8FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GDG RACE - Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../play.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <div class="brand" id="brand"></div>
    <div id="conn" class="conn"><i></i><span>Connecting…</span></div>
  </header>

  <!-- Join: code, name, car -->
  <section id="view-join" class="view">
    <h1 class="outlined tilt">GDG RACE</h1>
    <div class="hero" aria-hidden="true">
      <span id="hero-car" class="toy"><i class="wf t"></i><i class="wf b"></i><b class="body"><em id="hero-num">1</em></b></span>
    </div>
    <div class="joincard">
      <label class="f-code">Room
        <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ABCD">
      </label>
      <label class="f-name">Your name
        <input id="name" maxlength="16" autocomplete="nickname" placeholder="Racing name">
      </label>
    </div>
    <div class="lbl" id="pick-lbl">Pick your car!</div>
    <div id="cars" class="cars" role="group" aria-labelledby="pick-lbl"></div>
    <div class="join-foot">
      <p id="join-msg" class="msg" role="status"></p>
      <button id="join" class="btn go big" disabled>JOIN RACE!</button>
    </div>
  </section>

  <!-- Controller -->
  <section id="view-play" class="view hidden">
    <div class="info">
      <div id="car-art" class="car-art"></div>
      <div class="who"><div id="me-name" class="me-name"></div><div id="me-car" class="me-car"></div></div>
      <div id="status" class="status">Waiting for host…</div>
      <div id="count" class="count hidden">10</div>
      <div id="stats" class="stats"></div>
      <div id="result" class="result hidden"></div>
    </div>
    <div id="pads" class="pads disabled">
      <button id="btn-left" class="pad left" type="button" aria-label="Steer left"><svg class="arrow" viewBox="0 0 60 60" aria-hidden="true"><path d="M38 10 16 30l22 20" fill="none" stroke="#1B1340" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 10 16 30l22 20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t">LEFT</span></button>
      <button id="btn-right" class="pad right" type="button" aria-label="Steer right"><svg class="arrow" viewBox="0 0 60 60" aria-hidden="true"><path d="M22 10l22 20-22 20" fill="none" stroke="#1B1340" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 10l22 20-22 20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t">RIGHT</span></button>
    </div>
  </section>
</main>

<script src="../socket.io/socket.io.js"></script>
<script src="../shared/game.js"></script>
<script src="../play.js"></script>
</body>
</html>
